---
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Unit tests and catalog
        run: |
          python3 mirror.py targets
          python3 -m unittest discover -s tests -v
      - name: Install registry-copy tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
      - name: Disposable low and high registries
        run: |
          docker run -d --name low -p 127.0.0.1:15000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker run -d --name high -p 127.0.0.1:15001:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:15000/v2/
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:15001/v2/
      - name: Sync, export, send and import between real registries
        env:
          E2E_LOW_REGISTRY: 127.0.0.1:15000
          E2E_HIGH_REGISTRY: 127.0.0.1:15001
          E2E_TLS_VERIFY: 'false'
          E2E_FIXTURES: 'true'
        run: python3 tests/e2e.py
  nifi-nar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test the NiFi processors NAR
        working-directory: nifi/container-images-processors
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nifi-container-images-nar
          path: nifi/container-images-processors/nifi-container-images-nar/target/*.nar
