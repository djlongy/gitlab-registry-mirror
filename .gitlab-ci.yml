---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, publish]
variables:
  PYTHON_IMAGE: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
  # Debug variants carry a busybox shell; the binaries are /syft and /grype.
  SYFT_IMAGE: 'docker.io/anchore/syft:v1.54.0-debug'
  GRYPE_IMAGE: 'docker.io/anchore/grype:v0.120.0-debug'
  GRYPE_FAIL_ON: 'critical'
  # true adds the Syft SBOM and Grype scan before sync; sync waits for them.
  MIRROR_SCAN: 'false'
  # Runner tag for every job; empty sends them to any runner that takes untagged jobs.
  MIRROR_JOB_TAG: ''
  # Where the pipeline sends the tar of new images. Set one: NIFI_URL (a ListenHTTP), S3_BUCKET
  # (at S3_ENDPOINT, keys in AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, S3_PREFIX optional) or
  # MIRROR_SEND_PATH (a directory mounted on the runner, e.g. an NFS share). None: sync only.
  NIFI_URL: ''
  S3_BUCKET: ''
  MIRROR_SEND_PATH: ''
  # Run pipeline with EXPORT_ALL=true sends every catalog image, not only what is new.
  EXPORT_ALL: 'false'
  # Split the export into tars of at most this size, e.g. 4GiB. Empty: one tar.
  MIRROR_MAX_SIZE: ''
  # A disk with room for the export while it is built. Empty: the job directory.
  MIRROR_STAGING_DIR: ''
  # PEM file of extra CAs (or self-signed certificates) every connection trusts on top of the system
  # roots: registries, GitLab, S3 and NiFi. Commit it under certs/, e.g. ./certs/ca-bundle.crt.
  CA_BUNDLE: ''

verify:
  stage: verify
  image: $PYTHON_IMAGE
  tags: [$MIRROR_JOB_TAG]
  dependencies: []
  script:
    - python3 mirror.py targets
    - python3 -m unittest discover -s tests -v
    # What sync copies next; sbom and scan check exactly these. The job token reads the ledger.
    - python3 mirror.py pending > pending.txt
    - cat pending.txt
  artifacts:
    paths: [pending.txt]
    expire_in: 1 week

.gate: &gate
  stage: verify
  tags: [$MIRROR_JOB_TAG]
  # A docker executor runs the job in the scanner's image; a shell executor has only podman, so
  # run_image starts the same image through it. Grype's database goes in the job directory.
  before_script:
    - |
      run_image() {
        image=$1; binary=$2; shift 2
        if [ -x "$binary" ]; then "$binary" "$@"
        else podman run --rm --user 0 -v "$PWD:$PWD:z" -w "$PWD" -e GRYPE_DB_CACHE_DIR="$PWD/.grype-db" \
          --entrypoint "$binary" "$image" "$@"; fi
      }
  after_script:
    - rm -rf .grype-db
  rules:
    - if: '$MIRROR_SCAN != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - images.txt
        - mirror.py
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

# One CycloneDX SBOM per pending image, for the platform the mirror carries. Charts hold no packages.
sbom:
  <<: *gate
  image:
    name: $SYFT_IMAGE
    entrypoint: ['']
  needs: [verify]
  script:
    - |
      mkdir -p sbom
      failed=0
      while read -r source; do
        name="${source%@*}"; digest="${source#*@}"; reference="${name%:*}@$digest"
        file="sbom/$(echo "$digest" | tr : -).cdx.json"
        echo "sbom: $source"
        if ! run_image "$SYFT_IMAGE" /syft scan "registry:$reference" --platform "${MIRROR_PLATFORM:-linux/amd64}" \
            -o "cyclonedx-json=$file" 2> syft.err; then
          rm -f "$file"
          if grep -q 'application/vnd.cncf.helm' syft.err; then
            echo "chart, no packages to list: $source"
          else
            cat syft.err; failed=1
          fi
        fi
      done < pending.txt
      exit "$failed"
  artifacts:
    paths: [sbom/]
    expire_in: 1 week

# A merge request needs this to pass (Pipelines must succeed), and sync waits for it.
scan:
  <<: *gate
  image:
    name: $GRYPE_IMAGE
    entrypoint: ['']
    docker:
      user: root  # the image runs as uid 65532, which cannot write the job's checkout
  needs: [sbom]
  script:
    - |
      failed=0
      for file in sbom/*.cdx.json; do
        [ -e "$file" ] || continue
        echo "grype: $file"
        run_image "$GRYPE_IMAGE" /grype "sbom:$file" --only-fixed --fail-on "$GRYPE_FAIL_ON" -o table \
          -o "json=${file%.cdx.json}.grype.json" || failed=1
      done
      exit "$failed"
  artifacts:
    when: always
    paths: [sbom/]
    expire_in: 1 week

# A runner with python3, skopeo and curl. sync copies the catalog into TARGET_REGISTRY; export and
# send carry what is new as a tar when a destination is set. The ledger lives in the package registry.
# Merge-request validation runs elsewhere, without registry credentials.
sync:
  stage: publish
  environment:
    name: mirror-low
    action: prepare
  tags: [$MIRROR_JOB_TAG]
  resource_group: registry-mirror
  needs:
    - job: verify
      artifacts: false
    - job: scan
      artifacts: true
      optional: true  # absent unless MIRROR_SCAN=true
  variables:
    # A CI job has no XDG_RUNTIME_DIR, so skopeo's default auth file is not writable.
    REGISTRY_AUTH_FILE: '$CI_PROJECT_DIR/.registry-auth.json'
  script:
    - python3 mirror.py login
    - python3 mirror.py sync
    - |
      set -- ${NIFI_URL:+--nifi-url "$NIFI_URL"} ${S3_BUCKET:+--s3-bucket "$S3_BUCKET"} ${MIRROR_SEND_PATH:+--path "$MIRROR_SEND_PATH"}
      if [ "$#" -eq 0 ]; then
        echo "no NIFI_URL, S3_BUCKET or MIRROR_SEND_PATH: sync only"
      else
        python3 mirror.py export -o "export/mirror-export-$CI_PIPELINE_ID.tar" $([ "$EXPORT_ALL" = "true" ] && echo --all)
        if ls export/*.tar >/dev/null 2>&1; then python3 mirror.py send export/*.tar "$@"; fi
      fi
    # Keep each sent image's SBOM and scan report, by digest, for audit.
    - |
      for file in sbom/*.json; do
        [ -e "$file" ] || continue
        base=$(basename "$file"); version=${base%%.*}
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "${GITLAB_API_URL:-$CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/generic/registry-mirror-sbom/$version/$base"
        echo "kept: registry-mirror-sbom/$version/$base"
      done
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.registry-auth.json" "$CI_PROJECT_DIR/export"
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    # A project without a target registry is the source repository, not a deployment: nothing to sync.
    - if: '$TARGET_REGISTRY == null'
      when: never
    - if: '$TARGET_REGISTRY == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - images.txt
        - mirror.py
        - .gitlab-ci.yml
